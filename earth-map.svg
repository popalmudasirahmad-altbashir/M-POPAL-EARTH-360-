<svg xmlns="http://www.w3.org/2000/svg"
xmlns:xlink="http://www.w3.org/1999/xlink"
viewBox="0 0 2048 1024"
width="2048"
height="1024">

  <defs><radialGradient id="oceanGlow"
                cx="50%" cy="50%"
                r="70%">
  <stop offset="0%" stop-color="#123f55"/>
  <stop offset="55%" stop-color="#062b3d"/>
  <stop offset="100%" stop-color="#010a12"/>
</radialGradient>

<filter id="softGlow">
  <feGaussianBlur stdDeviation="2.2"/>
</filter>

  </defs>  <!-- SPACE / OCEAN BACKGROUND --><rect
x="0"
y="0"
width="2048"
height="1024"
fill="url(#oceanGlow)"
/>

  <!-- REAL WORLD MAP DATA
       Natural Earth / public-domain geographic data --><image
x="0"
y="0"
width="2048"
height="1024"
preserveAspectRatio="none"
href="https://raw.githubusercontent.com/sqaxomonophonen/worldmapsvg/master/svg/world.svg"
xlink:href="https://raw.githubusercontent.com/sqaxomonophonen/worldmapsvg/master/svg/world.svg"
opacity="0.96"
/>

  <!-- LONGITUDE LINES --><g
fill="none"
stroke="#ffffff"
stroke-width="2"
opacity="0.20">

<path d="M256 0 Q430 512 256 1024"/>
<path d="M512 0 Q640 512 512 1024"/>
<path d="M768 0 Q820 512 768 1024"/>
<path d="M1024 0 Q1024 512 1024 1024"/>
<path d="M1280 0 Q1228 512 1280 1024"/>
<path d="M1536 0 Q1408 512 1536 1024"/>
<path d="M1792 0 Q1618 512 1792 1024"/>

  </g>  <!-- LATITUDE LINES --><g
fill="none"
stroke="#ffffff"
stroke-width="2"
opacity="0.20">

<path d="M0 128 Q1024 65 2048 128"/>
<path d="M0 256 Q1024 205 2048 256"/>
<path d="M0 384 Q1024 350 2048 384"/>
<path d="M0 512 Q1024 512 2048 512"/>
<path d="M0 640 Q1024 674 2048 640"/>
<path d="M0 768 Q1024 819 2048 768"/>
<path d="M0 896 Q1024 959 2048 896"/>

  </g>  <!-- EQUATOR --><path
d="M0 512 Q1024 505 2048 512"
fill="none"
stroke="#ffffff"
stroke-width="4"
opacity="0.48"/>

  <!-- PRIME MERIDIAN --><path
d="M1024 0 Q1015 512 1024 1024"
fill="none"
stroke="#ffffff"
stroke-width="4"
opacity="0.48"/>

  <!-- OUTER MAP GLOW --><rect
x="3"
y="3"
width="2042"
height="1018"
fill="none"
stroke="#ffffff"
stroke-width="6"
opacity="0.65"
filter="url(#softGlow)"/>

  <!-- MAP FRAME --><rect
x="8"
y="8"
width="2032"
height="1008"
